# /etc/nginx/sites-available/__APP_NAME__ -> symlinked into sites-enabled.
#
# Replace `__APP_NAME__.example.com` throughout with the real domain (or the
# server's bare IP for an unadvertised-URL deployment — certbot then isn't
# usable and TLS has to be provided another way, e.g. a self-signed cert
# behind a VPN). See docs/deployment_lightsail.md for the full setup
# sequence.
#
# This file intentionally has only a plain HTTP (port 80) server block.
# `certbot --nginx` rewrites it in place: it adds the redirect to HTTPS
# here and generates its own 443 server block with the real
# ssl_certificate/ssl_certificate_key paths. Hand-writing that 443 block
# ourselves would reference cert files that don't exist yet on a fresh
# host, which fails `nginx -t` before certbot ever gets to run.

upstream __APP_NAME___app {
    server unix:/run/__APP_NAME__/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __APP_NAME__.example.com;

    client_max_body_size 1M;

    # Default combined log format only records the request line and
    # status, never the POST body — worth keeping as-is if the app handles
    # any sensitive form data.
    access_log /var/log/nginx/__APP_NAME__-access.log;
    error_log  /var/log/nginx/__APP_NAME__-error.log;

    location /static/ {
        alias /opt/__APP_NAME__/staticfiles/;
    }

    location / {
        proxy_pass http://__APP_NAME___app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
